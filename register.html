{% extends "base.html" %}
{% block title %}注册 - 雅思背单词{% endblock %}

{% block extra_css %}
<style>
.auth-wrap {
    min-height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}
.auth-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.12);
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
}
.auth-card h1 { text-align: center; font-size: 26px; color: #1a73e8; margin-bottom: 8px; }
.auth-card .subtitle { text-align: center; color: #90a4ae; font-size: 13px; margin-bottom: 28px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; color: #546e7a; margin-bottom: 6px; font-weight: 500; }
.form-control {
    width: 100%; padding: 10px 14px;
    border: 1.5px solid #cfd8dc; border-radius: 8px;
    font-size: 15px; outline: none; transition: border-color .2s; color: #333;
}
.form-control:focus { border-color: #1a73e8; }
.btn-block { width: 100%; padding: 11px; font-size: 16px; border-radius: 8px; margin-top: 6px; }
.auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #78909c; }
.auth-footer a { color: #1a73e8; text-decoration: none; }
.auth-footer a:hover { text-decoration: underline; }
.hint { font-size: 12px; color: #aaa; margin-top: 4px; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>📖 创建账号</h1>
        <p class="subtitle">注册后开始你的雅思备考之旅</p>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" class="form-control"
                       placeholder="2~20 个字符" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" class="form-control"
                       placeholder="至少 6 位" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="confirm" class="form-control"
                       placeholder="再次输入密码" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">注 册</button>
        </form>

        <div class="auth-footer">
            已有账号？<a href="{{ url_for('login') }}">立即登录</a>
        </div>
    </div>
</div>
{% endblock %}
