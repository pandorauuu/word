{% extends 'base.html' %}
{% block title %}验证邮箱{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:400px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:42px;margin-bottom:10px;">📬</div>
      <h2 style="font-size:26px;font-weight:700;margin-bottom:6px;">输入验证码</h2>
      <p style="color:#8a7e76;font-size:14px;">验证码已发送至<br>
        <strong style="color:#1a1410;">{{ email }}</strong>
      </p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div style="padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;
                    background:{% if category=='danger' %}#fdecea{% else %}#eafaf1{% endif %};
                    color:{% if category=='danger' %}#c0392b{% else %}#27ae60{% endif %};
                    border:1px solid {% if category=='danger' %}#f5c6cb{% else %}#a9dfbf{% endif %};">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}
    <form method="POST" action="/verify">
      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#3d3530;">
          6 位验证码
        </label>
        <input type="text" name="code" placeholder="123456"
               required maxlength="6" pattern="\d{6}"
               autocomplete="one-time-code"
               style="width:100%;padding:14px;border:1.5px solid #e4ddd2;
                      border-radius:10px;font-size:24px;font-weight:700;
                      letter-spacing:8px;text-align:center;background:#fff;
                      color:#1a1410;outline:none;box-sizing:border-box;">
      </div>
      <button type="submit"
              style="width:100%;padding:13px;border-radius:10px;border:none;
                     background:#1a1410;color:#faf7f2;font-size:15px;font-weight:700;
                     cursor:pointer;">
        验证并注册
      </button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:14px;color:#8a7e76;">
      没收到？检查垃圾邮件，或
      <a href="/register" style="color:#c8960c;font-weight:600;text-decoration:none;">重新发送</a>
    </p>
  </div>
</div>
{% endblock %}
