{% extends 'base.html' %}
{% block title %}登录{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="width:100%;max-width:400px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:42px;margin-bottom:10px;">📖</div>
      <h2 style="font-size:26px;font-weight:700;margin-bottom:6px;">欢迎回来</h2>
      <p style="color:#8a7e76;font-size:14px;">登录继续你的雅思词汇学习</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div style="padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;
                    background:{% if category=='danger' %}#fdecea{% elif category=='warning' %}#fef9e7{% else %}#eafaf1{% endif %};
                    color:{% if category=='danger' %}#c0392b{% elif category=='warning' %}#9a7d0a{% else %}#27ae60{% endif %};
                    border:1px solid {% if category=='danger' %}#f5c6cb{% elif category=='warning' %}#f9e79f{% else %}#a9dfbf{% endif %};">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/login">
      <div style="margin-bottom:14px;">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#3d3530;">
          邮箱地址
        </label>
        <input type="email" name="email" placeholder="your@email.com"
               required autocomplete="email"
               style="width:100%;padding:12px 14px;border:1.5px solid #e4ddd2;
                      border-radius:10px;font-size:15px;background:#fff;
                      color:#1a1410;outline:none;">
      </div>

      <div style="margin-bottom:20px;">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#3d3530;">
          密码
        </label>
        <input type="password" name="password" placeholder="••••••••"
               required autocomplete="current-password"
               style="width:100%;padding:12px 14px;border:1.5px solid #e4ddd2;
                      border-radius:10px;font-size:15px;background:#fff;
                      color:#1a1410;outline:none;">
      </div>

      <button type="submit"
              style="width:100%;padding:13px;border-radius:10px;border:none;
                     background:#1a1410;color:#faf7f2;font-size:15px;font-weight:700;
                     cursor:pointer;">
        登录
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:14px;color:#8a7e76;">
      还没有账号？
      <a href="/register" style="color:#c8960c;font-weight:600;text-decoration:none;">立即注册</a>
    </p>
  </div>
</div>
{% endblock %}
