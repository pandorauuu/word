<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建账号 - 雅思词汇</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(26, 115, 232, 0.08), 0 1px 8px rgba(0, 0, 0, 0.04);
            padding: 40px 36px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            text-align: center;
        }
        .auth-card h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(45deg, #1a73e8, #0d47a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 8px 0;
        }
        .auth-card .subtitle {
            color: #78909c;
            font-size: 13px;
            margin: 0 0 28px 0;
        }
        .form-group { 
            margin-bottom: 18px; 
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #455a64;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .form-control {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #cfd8dc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            color: #263238;
            background-color: #fbfbfb;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }
        /* ✨ 蓝色呼吸灯效果 */
        .form-control:focus { 
            border-color: #1a73e8; 
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.15);
        }
        .btn-code {
            white-space: nowrap;
            padding: 0 15px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-code:hover { background: #1557b0; }
        .btn-block { 
            width: 100%; 
            padding: 12px; 
            font-size: 16px; 
            font-weight: 600;
            color: #fff;
            background: linear-gradient(90deg, #1a73e8, #1557b0);
            border: none;
            border-radius: 8px; 
            margin-top: 10px; 
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.2);
            transition: all 0.2s;
        }
        .btn-block:hover { 
            background: linear-gradient(90deg, #1557b0, #0d47a1);
        }
        .auth-footer {
            margin-top: 20px;
            font-size: 13.5px;
            color: #607d8b;
        }
        .auth-footer a { color: #1a73e8; text-decoration: none; font-weight: 600; }
        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
            margin-bottom: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h1>📖 创建账号</h1>
    <p class="subtitle">注册后开始你的雅思备考之旅</p>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert">⚠️ {{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/register">
        <div class="form-group">
            <label>电子邮箱</label>
            <div class="input-group">
                <input type="email" name="email" id="email" class="form-control" placeholder="输入常用邮箱" required autocomplete="email">
                <button type="button" class="btn_code" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
            </div>
        </div>
        
        <div class="form-group">
            <label>邮箱验证码</label>
            <input type="text" name="code" class="form-control" placeholder="请输入6位验证码" required>
        </div>

        <div class="form-group">
            <label>设置密码</label>
            <input type="password" name="password" class="form-control" placeholder="至少 6 位" required autocomplete="new-password">
        </div>
        
        <button type="submit" class="btn-block">注 册</button>
    </form>

    <div class="auth-footer">
        已有账号？<a href="/login">立即登录</a>
    </div>
</div>

<script>
function sendCode() {
    const email = document.getElementById('email').value;
    if(!email) { alert('请先输入邮箱！'); return; }
    
    const btn = document.getElementById('sendCodeBtn');
    btn.disabled = true;
    btn.innerText = '正在发送...';

    fetch('/send_code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
    })
    .then(res => res.json())
    .then(data => {
        alert(data.message);
        if(data.status === 'success') {
            let countdown = 60;
            const timer = setInterval(() => {
                countdown--;
                btn.innerText = countdown + 's';
                if(countdown <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = '获取验证码';
                }
            }, 1000);
        } else {
            btn.disabled = false;
            btn.innerText = '获取验证码';
        }
    })
    .catch(() => {
        alert('发送失败，请检查网络或邮件环境变量配置！');
        btn.disabled = false;
        btn.innerText = '获取验证码';
    });
}
</script>
</body>
</html>
